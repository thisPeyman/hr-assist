[project]
name = "hr-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "fastapi[standard]>=0.158.0",
    "openai>=2.10",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21",
    "python-docx>=1.2.0",
    "sqlalchemy[asyncio]>=2.0.55",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
