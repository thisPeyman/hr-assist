name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: backend — schema + RLS + API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HR_TEST_ADMIN_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      HR_TEST_APP_URL: postgresql+asyncpg://hr_app:hr_app_dev@127.0.0.1:5432/hr_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check app tests migrations scripts

      # The pytest run includes the schema seam (fresh DB + migrations), the
      # RLS seam (cross-org proofs as the non-superuser hr_app role), and the
      # API seam (signup/login/logout/me over httpx against real Postgres).
      - name: Test
        run: uv run pytest -q

  frontend:
    name: frontend — lint + build + UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Test
        run: npm test

      - name: Email Worker tests
        run: node --test ../infra/email-worker/worker.test.mjs
