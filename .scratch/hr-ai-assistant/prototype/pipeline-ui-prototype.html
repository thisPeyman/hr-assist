    A "Board"          — kanban columns per org-wide Stage, candidate detail opens in a right drawer
    B "Table"          — dense spreadsheet of Applications, candidate detail is a full page, NL-chips-first

  Open directly in a browser (needs internet for CDN React/Tailwind). No build, no persistence.
-->

/* ------------------------------- shadcn-styled primitives (rough stand-ins) ------------------------------- */
const Btn = ({children, variant="default", size="md", className="", ...p}) => {
  const base = "inline-flex items-center justify-center gap-1.5 rounded-md font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-slate-400 disabled:opacity-50 cursor-pointer select-none";
  const variants = { default:"bg-primary text-primaryfg hover:bg-slate-800", outline:"border border-border bg-white hover:bg-accent", ghost:"hover:bg-accent", secondary:"bg-muted hover:bg-slate-200" };
  const sizes = { sm:"h-7 px-2.5 text-xs", md:"h-9 px-3.5 text-sm" };
  return <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...p}>{children}</button>;
};
const Badge = ({children, tone="muted", className=""}) => {
  const tones = { muted:"bg-muted text-mutedfg", green:"bg-emerald-100 text-emerald-800", amber:"bg-amber-100 text-amber-800", blue:"bg-sky-100 text-sky-800", rose:"bg-rose-100 text-rose-800", violet:"bg-violet-100 text-violet-800" };
  return <span className={`inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-medium ${tones[tone]} ${className}`}>{children}</span>;
};
const Card = ({children, className=""}) => <div className={`rounded-lg border border-border bg-white shadow-sm ${className}`}>{children}</div>;
const Chip = ({children, onRemove}) => (
  <span className="inline-flex items-center gap-1 rounded-full border border-slate-300 bg-white px-2 py-0.5 text-xs text-slate-700">
    {children}{onRemove && <button onClick={onRemove} className="text-slate-400 hover:text-slate-700 cursor-pointer">✕</button>}
  </span>
);
const Dialog = ({open, onClose, title, children, wide}) => {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4" onClick={onClose}>
      <div className={`max-h-[88vh] overflow-auto rounded-xl bg-white shadow-2xl ${wide?"w-full max-w-3xl":"w-full max-w-lg"}`} onClick={e=>e.stopPropagation()}>
        <div className="sticky top-0 flex items-center justify-between border-b border-border bg-white px-5 py-3">
          <h3 className="text-sm font-semibold">{title}</h3>
          <button onClick={onClose} className="rounded p-1 text-mutedfg hover:bg-muted cursor-pointer">✕</button>
        </div>
        <div className="p-5 text-sm">{children}</div>
      </div>
    </div>
  );
};
const StageBadge = ({stage}) => {
  const tone = { Sourced:"muted", Screening:"blue", Interview:"violet", Offer:"green", Hired:"green", Rejected:"rose", Withdrawn:"amber" }[stage];
  return <Badge tone={tone}>{stage}</Badge>;
};
const initials = n => n.split(" ").map(w=>w[0]).join("");

/* ---------------- NL search bar (from ticket 04: filters → editable chips + semantic residual) ---------------- */

      <div className="flex flex-wrap items-center gap-1.5">
        {chips.map((c,i)=>(

};
const ProposeSlots = ({open, onClose, onPreviewBooking, c}) => {

            {slots.map(s=>(
              <button key={s.id} disabled={s.busy} onClick={()=>setPicked(p=>p.includes(s.id)?p.filter(x=>x!==s.id):[...p,s.id])}
                className={`rounded-md border p-2 text-left text-sm cursor-pointer ${s.busy?"border-border bg-muted opacity-50":picked.includes(s.id)?"border-slate-900 bg-slate-900 text-white":"border-border bg-white hover:bg-accent"}`}>

const BookingPreview = ({open, onClose}) => {
  const [state, setState] = useState("pick"); // pick | done
  const slots = [{d:"Tue 21 Oct",t:"10:00"},{d:"Tue 21 Oct",t:"14:30"},{d:"Fri 24 Oct",t:"11:00"}];
  return (
    <Dialog open={open} onClose={()=>{onClose(); setState("pick");}} title="Booking Page — what the candidate sees" wide>
      {state==="pick" ? (
        <div className="mx-auto max-w-sm space-y-3 text-center">
          <div className="text-xs text-mutedfg">Video interview · 45 min · Google Meet</div>
          <div className="text-sm font-medium">Pick a time with Peyman @ Acme</div>

            {slots.map(s=>(
              <button key={s.t} onClick={()=>setState("done")} className="w-full rounded-md border border-border p-2.5 hover:bg-accent cursor-pointer">
                <div className="text-sm font-medium">{s.d}</div><div className="text-xs text-mutedfg">{s.t}</div>
              </button>
            ))}
          </div>
          <div className="text-[10px] text-mutedfg">reschedule/cancel allowed until 12h before · no login needed</div>
        </div>

        <div className="mx-auto max-w-sm space-y-3 py-6 text-center">
          <div className="text-3xl">✓</div>
          <div className="text-sm font-semibold">Booked — Tue 21 Oct, 10:00</div>
          <p className="text-xs text-mutedfg">Calendar invite + Meet link are on their way.<br/>Reminders 24h and 1h before. Need a change? Reschedule until 12h before.</p>
          <Btn variant="outline" size="sm" onClick={()=>setState("pick")}>← back (demo)</Btn>
        </div>
      )}
    </Dialog>
  );
};

/* ================================================ VARIANT A — BOARD ================================================ */
const VariantA = () => {
  const [apps, setApps] = useState(CANDIDATES);
  const [sel, setSel] = useState(null);
  const [dlg, setDlg] = useState(null); // draft | slots | booking
  const move = (id, dir) => setApps(as => as.map(a => a.id!==id ? a : {...a, stage: STAGES[Math.min(STAGES.length-1, Math.max(0, STAGES.indexOf(a.stage)+dir))]}));
  const selC = apps.find(a=>a.id===sel);
  return (
    <div className="flex h-screen flex-col">
      <header className="flex items-center gap-3 border-b border-border px-4 py-2.5">
        <span className="text-sm font-bold">hire.</span>
        <select className="h-8 rounded-md border border-border bg-white px-2 text-sm"><option>All roles</option>{ROLES.map(r=><option key={r.id}>{r.title} ({r.status})</option>)}</select>
        <NLSearch className="flex-1"/>
        <Badge tone="amber">3 unassigned</Badge>
        <span className="flex h-7 w-7 items-center justify-center rounded-full bg-slate-900 text-[10px] text-white">P</span>
      </header>
      <main className="flex flex-1 gap-3 overflow-x-auto bg-muted/60 p-3">
        {[...STAGES, "Rejected"].map(st => (
          <div key={st} className="flex w-60 shrink-0 flex-col">
            <div className="mb-2 flex items-center justify-between px-1 text-xs font-semibold text-mutedfg">
              <span>{st.toUpperCase()}</span><span>{apps.filter(a=>a.stage===st).length}</span>
            </div>
            <div className="flex-1 space-y-2">
              {apps.filter(a=>a.stage===st).map(c=>(
                <Card key={c.id} className="group cursor-pointer p-2.5" onClick={()=>setSel(c.id)}>
                  <div className="flex items-center gap-2">
                    <span className="flex h-6 w-6 items-center justify-center rounded-full bg-violet-100 text-[9px] font-semibold text-violet-700">{initials(c.name)}</span>
                    <span className="truncate text-[13px] font-medium">{c.name}</span>
                    {c.owner && <span className="ml-auto text-[9px] text-mutedfg">{c.owner}</span>}
                  </div>
                  <div className="mt-1 truncate text-[11px] text-mutedfg">{c.role}</div>
                  <div className="mt-1.5 flex items-center gap-1">
                    <Badge tone="muted">{c.yoe} yrs</Badge>
                    {c.interview && <Badge tone="violet">📅 {c.interview.when}</Badge>}
                    {!c.owner && <Badge tone="amber">unassigned</Badge>}
                  </div>
                  <div className="mt-1.5 hidden gap-1 group-hover:flex">
                    {st!=="Sourced" && st!=="Rejected" && <Btn size="sm" variant="ghost" onClick={e=>{e.stopPropagation();move(c.id,-1);}}>←</Btn>}
                    {st!=="Hired" && st!=="Rejected" && <Btn size="sm" variant="ghost" onClick={e=>{e.stopPropagation();move(c.id,1);}}>→</Btn>}
                  </div>
                </Card>
              ))}
            </div>
          </div>
        ))}
      </main>
      {/* right drawer: candidate detail */}
      {selC && (
        <div className="fixed inset-y-0 right-0 z-40 flex w-[440px] flex-col border-l border-border bg-white shadow-2xl">
          <div className="flex items-start justify-between border-b border-border p-4">
            <div>
              <div className="text-base font-semibold">{selC.name}</div>
              <div className="text-xs text-mutedfg">{selC.role} · <StageBadge stage={selC.stage}/></div>
            </div>
            <button onClick={()=>setSel(null)} className="rounded p-1 hover:bg-muted cursor-pointer">✕</button>
          </div>
          <div className="flex-1 space-y-4 overflow-auto p-4">
            <AIActions c={selC} onAction={a=>setDlg(a==="slots"?"slots":a==="draft"?"draft":null)}/>
            <SummaryCard c={selC}/>
            <ResumeView c={selC}/>
            <div><div className="mb-2 text-xs font-semibold uppercase tracking-wide text-mutedfg">Notes & Activity</div><Timeline/></div>
          </div>
        </div>
      )}
      <DraftEmail open={dlg==="draft"} onClose={()=>setDlg(null)} c={selC}/>
      <ProposeSlots open={dlg==="slots"} onClose={()=>setDlg(null)} onPreviewBooking={()=>setDlg("booking")} c={selC}/>
      <BookingPreview open={dlg==="booking"} onClose={()=>setDlg(null)}/>
    </div>
  );
};

/* ------------------------------------------- floating prototype switcher ------------------------------------------- */
const VARIANTS = { A:VariantA, B:VariantB, C:VariantC };
const NAMES = { A:"Board (kanban + drawer)", B:"Table (spreadsheet + full page)", C:"Master-detail (three-pane preview)" };
const PrototypeSwitcher = ({variant, setVariant}) => (
  <div className="fixed bottom-4 left-1/2 z-[60] flex -translate-x-1/2 items-center gap-2 rounded-full bg-slate-900 px-3 py-1.5 text-white shadow-2xl">
    <button onClick={()=>setVariant(prev)} className="rounded-full px-2 text-lg hover:bg-white/20 cursor-pointer">←</button>
    <div className="min-w-[210px] text-center text-xs font-semibold tracking-wide">{variant} · {NAMES[variant]} <span className="ml-1 font-normal text-slate-400">(← → keys)</span></div>
    <button onClick={()=>setVariant(next)} className="rounded-full px-2 text-lg hover:bg-white/20 cursor-pointer">→</button>
  </div>
);

const App = () => {
  const keys = Object.keys(VARIANTS);
  const [variant, setVariantState] = useState(() => {
    const m = (location.search.match(/variant=([ABC])/) || [])[1];
    return m && VARIANTS[m] ? m : "A";
  });
  const setVariant = v => {
    setVariantState(v);
    try { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); } catch(e) {}
  };
  useEffect(() => {
    const onKey = e => {
      if (["INPUT","TEXTAREA"].includes(e.target.tagName) || e.target.isContentEditable) return;
      if (e.key === "ArrowLeft") setVariant(prev(variant));
      if (e.key === "ArrowRight") setVariant(next(variant));
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [variant]);
  const prev = v => keys[(keys.indexOf(v)-1+keys.length)%keys.length];
  const next = v => keys[(keys.indexOf(v)+1)%keys.length];
  const V = VARIANTS[variant];
  return (
    <div className="pb-16">
      <div className="bg-amber-400 px-3 py-0.5 text-center text-[11px] font-semibold text-amber-950">PROTOTYPE — throwaway, ticket 08</div>
      <V/>
      <PrototypeSwitcher variant={variant} setVariant={setVariant}/>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
